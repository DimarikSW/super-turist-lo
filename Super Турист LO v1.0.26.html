<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Super Турист LO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:#87CEEB;font-family:sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{display:block}
#ui{position:fixed;top:10px;left:10px;color:#fff;z-index:2;background:rgba(0,0,0,.35);padding:8px 14px;border-radius:12px;font-weight:bold;font-size:18px}
#mute{position:fixed;top:10px;right:10px;z-index:2;font-size:20px;background:rgba(0,0,0,.35);color:#fff;border:none;border-radius:12px;padding:8px 12px;cursor:pointer}
#hint{position:fixed;bottom:6px;width:100%;text-align:center;color:rgba(255,255,255,.9);font-size:13px;z-index:2;pointer-events:none}
.control-btn{position:fixed;display:none;align-items:center;justify-content:center;border-radius:50%;background:rgba(255,255,255,.28);color:#fff;font-size:34px;z-index:3;border:2px solid rgba(255,255,255,.45);-webkit-tap-highlight-color:transparent}
body.touch .control-btn{display:flex}
.btn-jump{left:24px;bottom:46px;width:96px;height:96px;background:rgba(255,215,0,.45);color:#5a3d00;font-size:40px}
.btn-left{right:150px;bottom:46px;width:76px;height:76px}
.btn-right{right:44px;bottom:46px;width:76px;height:76px}
.control-btn.active{background:rgba(255,255,255,.55);transform:scale(.93)}
.overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(20,40,60,.78);color:#fff;text-align:center;z-index:5;gap:16px;padding:20px}
.overlay h1{font-size:30px;text-shadow:2px 2px 0 #2c5f8a}
.overlay button{padding:14px 40px;font-size:20px;font-weight:bold;cursor:pointer;background:#ffcc00;border:none;border-radius:14px;color:#5a3d00;box-shadow:0 4px 0 #b38f00}
.overlay button:active{transform:translateY(3px);box-shadow:0 1px 0 #b38f00}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">❤️ <span id="lives">3</span> &nbsp; 🪙 <span id="score">0</span> &nbsp; ⛰️ <span id="level">1</span>/99</div>
<button id="mute" onclick="toggleMute()">🔊</button>
<div id="hint"></div>
<div class="control-btn btn-jump" id="btn-jump">▲</div>
<div class="control-btn btn-left" id="btn-left">◀</div>
<div class="control-btn btn-right" id="btn-right">▶</div>
<div class="overlay" id="start">
  <h1>⛰️ Super Турист LO</h1>
  <p>99 уровней горных троп! Собирай сувениры, прыгай зверям на голову,<br>бургеры дают жизнь. На вершине финальной горы — лагерь,<br>где тебя встретят друзья!</p>
  <button onclick="startGame()">В путь!</button>
</div>
<div class="overlay" id="over" style="display:none">
  <h1>😵 Путешествие окончено</h1>
  <p id="overText"></p>
  <button onclick="restartAll()">Начать заново</button>
</div>
<div class="overlay" id="win" style="display:none">
  <h1 id="winTitle">🏆 Экспедиция завершена!</h1>
  <p id="winText"></p>
  <button id="winBtn" onclick="winNext()">Дальше ▶</button>
</div>
<script>
const cvs=document.getElementById('game'),ctx=cvs.getContext('2d');
let W,H;
function resize(){W=cvs.width=innerWidth;H=cvs.height=innerHeight;}
addEventListener('resize',resize);resize();

// ===== ГСЧ с фиксированным зерном (уровни повторяемы) =====
function rng(seed){let s=(seed>>>0)||1;return function(){s=(Math.imul(s,1664525)+1013904223)>>>0;return s/4294967296;};}

// ===== СОСТОЯНИЕ =====
const MAXLVL=99;
const hero={x:60,y:0,w:30,h:44,vx:0,vy:0,onGround:false,dir:1,run:0};
let coins=[],plats=[],pits=[],enemies=[],sandwiches=[],parts=[];
let level=0,score=0,lives=3,camX=0,camY=0,playing=false,dead=false;
let celebrating=false,celebT=0;
let totalW=0,mX=0,mW=0,mH=0,peakX=0,peakY=0,groundY=0;
const input={left:false,right:false,jump:false};
let jumpBuf=0,jumpHeld=false,prevJump=false;

// Рельеф горы: плато на вершине, крутизна растёт к подножию
function mGroundY(x){
  if(x<mX||x>mX+mW)return groundY;
  const d=Math.abs(x-peakX);
  if(d<200)return peakY+16; // плато 400 px
  const t=Math.min(1,(d-200)/(mW/2-200));
  const s=t*t*(3-2*t); // плавный S-образный склон
  return peakY+16+(mH-16)*s;
}
function inPit(px){return pits.some(p=>px>p.x1+6&&px<p.x2-6);}

// ===== ГЕНЕРАТОР УРОВНЕЙ =====
function makeLevel(n){ // n: 0..98
  const rnd=rng(1000+n*7919);
  groundY=H-60;
  const pathLen=Math.round(3600+n*51.8);
  mW=Math.min(1800,1100+n*7);
  mH=Math.min(420,230+n*1.8);
  mX=pathLen+220;
  peakX=mX+mW/2;peakY=groundY-mH;
  totalW=mX+mW+320;
  // пропасти: всё больше и шире с уровнем
  pits=[];
  const pitCount=Math.min(10,3+Math.floor(n/12));
  let px=520;
  const gap=(pathLen-1100)/pitCount;
  for(let i=0;i<pitCount;i++){
    px+=gap*(0.55+rnd()*0.9);
    const w=Math.min(230,110+n*1.2+rnd()*45);
    pits.push({x1:px,x2:px+w});
    px+=w;
  }
  // платформы
  plats=[];
  let sx=420;
  while(sx<pathLen-280){
    const pw=(3+Math.floor(rnd()*4))*TILE;
    const py=groundY-(110+Math.floor(rnd()*100));
    plats.push({x:sx,y:py,w:pw,h:14});
    sx+=340+rnd()*180;
  }
  // звери: вдвое больше, медведи с 5-го уровня (каждый второй)
  enemies=[];
  const eCount=Math.min(20,(2+Math.floor(n/9))*2);
  const segs=[];let a=90;
  for(const p of pits){segs.push([a,p.x1-40]);a=p.x2+40;}
  segs.push([a,pathLen-80]);
  let placed=0,pass=0;
  while(placed<eCount&&pass<segs.length*4){
    const s=segs[pass%segs.length];pass++;
    const len=s[1]-s[0];
    if(len<150)continue;
    const x=s[0]+50+rnd()*Math.max(1,len-110);
    const range=Math.max(40,Math.min(len/2-40,110+rnd()*80));
    const bear=(n>=4)&&(placed%2===1);
    enemies.push({x0:x,x:x,dir:rnd()<0.5?-1:1,vy:0,y:0,jt:60+rnd()*90,alive:true,ph:rnd()*6,range:range,bear:bear,w:bear?46:34,hh:bear?32:26});
    placed++;
  }
  // сувениры
  coins=[];
  let cx2=260;
  while(cx2<pathLen-140){
    for(let k=0;k<3;k++)coins.push({x:cx2+k*46,y:groundY-40-rnd()*20,got:false});
    cx2+=280+rnd()*260;
  }
  for(const p of plats){
    if(rnd()<0.7){
      const nc=2+Math.floor(rnd()*3);
      for(let k=0;k<nc;k++)coins.push({x:p.x+p.w/2+(k-(nc-1)/2)*40,y:p.y-30,got:false});
    }
  }
  // бургеры: на 40% уровней
  sandwiches=[];
  if(rnd()<0.4){
    const p=plats.length?plats[Math.floor(rnd()*plats.length)]:null;
    if(p)sandwiches.push({x:p.x+p.w/2,y:p.y-32,got:false,ph:rnd()*6});
    else sandwiches.push({x:400+rnd()*(pathLen-600),y:groundY-32,got:false,ph:rnd()*6});
  }
  hero.x=60;hero.y=groundY-hero.h;hero.vx=hero.vy=0;hero.onGround=true;
  parts=[];celebrating=false;celebT=0;
  document.getElementById('level').textContent=n+1;
}
const TILE=40;
function loadLevel(n){makeLevel(n);}

// ===== ЗВУК =====
let actx=null,muted=false,musicTimer=null,musicStep=0;
function initAudio(){if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();}
function tone(f,d,type,v,f2){
  if(muted||!actx)return;
  type=type||'square';v=(v===undefined)?0.12:v;
  const t=actx.currentTime,o=actx.createOscillator(),g=actx.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);
  o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+d);
}
const sfx={
  jump(){tone(320,0.12,'square',0.09,620);},
  coin(){tone(988,0.07,'square',0.1);setTimeout(()=>tone(1319,0.11,'square',0.1),60);},
  stomp(){tone(260,0.14,'sawtooth',0.14,80);},
  eat(){tone(660,0.09,'triangle',0.12);setTimeout(()=>tone(880,0.14,'triangle',0.12),80);},
  die(){tone(300,0.5,'sawtooth',0.14,55);},
  lvl(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,0.15,'square',0.11),i*110));},
  win(){[523,659,784,1047,784,1047,1319].forEach((f,i)=>setTimeout(()=>tone(f,0.22,'triangle',0.13),i*180));}
};
const MELODY=[392,392,440,392,523,494,440,392,349,349,440,392,523,494,440,0,392,392,440,392,523,587,523,494,440,392,349,392,523,0,0,0];
function musicTick(){
  if(!playing||muted||!actx)return;
  const nn=MELODY[musicStep%MELODY.length];musicStep++;
  if(nn)tone(nn,0.18,'triangle',0.045);
}
function toggleMute(){
  muted=!muted;
  document.getElementById('mute').textContent=muted?'🔇':'🔊';
}

// ===== УПРАВЛЕНИЕ =====
const keys={};
addEventListener('keydown',e=>{keys[e.code]=true;if(['Space','ArrowUp','KeyW'].includes(e.code))e.preventDefault();});
addEventListener('keyup',e=>keys[e.code]=false);
const isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
if(isTouch){
  document.body.classList.add('touch');
  document.getElementById('hint').textContent='▲ — прыжок (держи дольше — выше) · ◀ ▶ — бег';
}else{
  document.getElementById('hint').textContent='← → или A/D — идти · Space / ↑ — прыжок (держи дольше — выше)';
}
function bindBtn(id,name){
  const el=document.getElementById(id);
  const on=e=>{e.preventDefault();input[name]=true;el.classList.add('active');};
  const off=e=>{if(e.cancelable)e.preventDefault();input[name]=false;el.classList.remove('active');};
  if(isTouch){
    el.addEventListener('touchstart',on,{passive:false});
    el.addEventListener('touchend',off,{passive:false});
    el.addEventListener('touchcancel',off,{passive:false});
  }
  el.addEventListener('mousedown',on);
  el.addEventListener('mouseup',off);
  el.addEventListener('mouseleave',off);
}
bindBtn('btn-left','left');bindBtn('btn-right','right');bindBtn('btn-jump','jump');
let tapJump=false;
cvs.addEventListener('touchstart',e=>{e.preventDefault();tapJump=true;},{passive:false});
cvs.addEventListener('touchend',e=>{e.preventDefault();tapJump=false;},{passive:false});
cvs.addEventListener('touchcancel',()=>{tapJump=false;});
cvs.addEventListener('mousedown',()=>{if(!isTouch)tapJump=true;});
cvs.addEventListener('mouseup',()=>{tapJump=false;});
addEventListener('blur',()=>{input.left=input.right=input.jump=false;tapJump=false;});
function wantLeft(){return input.left||keys.ArrowLeft||keys.KeyA;}
function wantRight(){return input.right||keys.ArrowRight||keys.KeyD;}
function wantJump(){return input.jump||tapJump||keys.Space||keys.ArrowUp||keys.KeyW;}

// ===== ПЕРЕХОДЫ =====
function kill(){
  if(dead)return;
  dead=true;playing=false;sfx.die();
  lives--;document.getElementById('lives').textContent=Math.max(0,lives);
  setTimeout(()=>{
    if(lives<=0){
      document.getElementById('overText').textContent='Счёт: '+score+'. Сувениры не пропьёшь — попробуй снова!';
      document.getElementById('over').style.display='flex';
    }else{loadLevel(level);dead=false;playing=true;}
  },600);
}
function winNext(){
  document.getElementById('win').style.display='none';
  if(level>=98)restartAll();else nextLevel();
}
function nextLevel(){
  playing=false;sfx.lvl();
  setTimeout(()=>{loadLevel(++level);dead=false;playing=true;},500);
}
function startCelebration(){
  celebrating=true;playing=false;celebT=0;sfx.win();
  for(let i=0;i<70;i++){
    parts.push({x:peakX+(Math.random()-0.5)*320,y:peakY-Math.random()*220,vx:(Math.random()-0.5)*3,vy:1+Math.random()*3,c:'hsl('+Math.floor(Math.random()*360)+',85%,60%)',life:120+Math.random()*100});
  }
  setTimeout(()=>{
    if(level>=98){
      document.getElementById('winTitle').textContent='🏆 Экспедиция завершена!';
      document.getElementById('winText').textContent='Ты дошёл до лагеря и прошёл все 99 уровней! Итоговый счёт: '+score;
      document.getElementById('winBtn').textContent='Ещё раз!';
    }else{
      document.getElementById('winTitle').textContent='✅ Уровень '+(level+1)+' пройден!';
      document.getElementById('winText').textContent='Счёт: '+score+'. Осталось уровней: '+(98-level);
      document.getElementById('winBtn').textContent='Дальше ▶';
    }
    document.getElementById('win').style.display='flex';
  },2600);
}
function restartAll(){
  document.getElementById('over').style.display='none';
  document.getElementById('win').style.display='none';
  score=0;lives=3;level=0;
  document.getElementById('score').textContent=0;
  document.getElementById('lives').textContent=3;
  loadLevel(0);dead=false;playing=true;
}
function startGame(){
  initAudio();if(actx&&actx.state==='suspended')actx.resume();
  document.getElementById('start').style.display='none';
  if(!musicTimer)musicTimer=setInterval(musicTick,240);
  restartAll();
}

// ===== ФИЗИКА =====
function physics(){
  const ACC=0.7,MAX=5,GRAV=0.6,GRAV_HOLD=0.32,JUMP=-12.5;
  const prevX=hero.x,prevBottom=hero.y+hero.h;
  let ax=0;
  if(wantLeft()){ax=-ACC;hero.dir=-1;}
  if(wantRight()){ax=ACC;hero.dir=1;}
  hero.vx=Math.max(-MAX,Math.min(MAX,hero.vx+ax));
  hero.vx*=(ax===0&&hero.onGround)?0.8:0.98;

  // прыжок с буфером: короткий тап не промахивается мимо кадра
  if(wantJump()&&!prevJump)jumpBuf=8;
  prevJump=wantJump();
  if(jumpBuf>0)jumpBuf--;
  if(jumpBuf>0&&hero.onGround){
    hero.vy=JUMP;hero.onGround=false;jumpHeld=true;jumpBuf=0;sfx.jump();
  }
  if(!wantJump()&&hero.vy<0&&jumpHeld){hero.vy*=0.45;jumpHeld=false;}
  hero.vy+=(hero.vy<0&&jumpHeld)?GRAV_HOLD:GRAV;
  if(hero.vy>=0)jumpHeld=false;

  hero.onGround=false;
  hero.x+=hero.vx;hero.y+=hero.vy;
  hero.x=Math.max(0,Math.min(totalW-120,hero.x));
  const cx=hero.x+hero.w/2;
  // платформы сплошные: верх, низ и бока
  for(const p of plats){
    if(hero.x+hero.w>p.x+2&&hero.x<p.x+p.w-2){
      if(hero.vy>=0&&prevBottom<=p.y+6&&hero.y+hero.h>=p.y){hero.y=p.y-hero.h;hero.vy=0;hero.onGround=true;}
      else if(hero.vy<0&&prevBottom-hero.h>=p.y+p.h-2&&hero.y<=p.y+p.h){hero.y=p.y+p.h;hero.vy=0;}
      else if(prevX+hero.w<=p.x+2&&hero.x+hero.w>p.x+2&&hero.y+hero.h>p.y+6&&hero.y<p.y+p.h){hero.x=p.x-hero.w-2;hero.vx=0;}
      else if(prevX>=p.x+p.w-2&&hero.x<p.x+p.w-2&&hero.y+hero.h>p.y+6&&hero.y<p.y+p.h){hero.x=p.x+p.w+2;hero.vx=0;}
    }
  }
  const gy=mGroundY(cx);
  if(hero.y+hero.h>=gy&&!inPit(cx)){
    if(hero.y+hero.h-gy<=30){hero.y=gy-hero.h;if(hero.vy>0)hero.vy=0;hero.onGround=true;}
  }
  if(inPit(cx)&&hero.y+hero.h>groundY+50)return kill();
  if(hero.vx!==0&&hero.onGround)hero.run+=0.3;
  if(hero.y>H+80)return kill();

  for(const c of coins){
    if(!c.got&&Math.abs(hero.x+hero.w/2-c.x)<30&&Math.abs(hero.y+hero.h/2-c.y)<34){
      c.got=true;score+=10;sfx.coin();
      document.getElementById('score').textContent=score;
    }
  }
  for(const s of sandwiches){
    if(!s.got&&Math.abs(hero.x+hero.w/2-s.x)<32&&Math.abs(hero.y+hero.h/2-s.y)<36){
      s.got=true;lives++;score+=100;sfx.eat();
      document.getElementById('lives').textContent=lives;
      document.getElementById('score').textContent=score;
    }
  }
  const gs=1+level*0.082;
  for(const g of enemies){
    if(!g.alive)continue;
    g.x+=g.dir*gs*(g.bear?0.6:1);
    if(Math.abs(g.x-g.x0)>g.range)g.dir*=-1;
    g.vy+=0.6;
    const egc=g.x+g.w/2;
    if(!inPit(egc)&&g.y+g.hh>=groundY){g.y=groundY-g.hh;g.vy=0;}
    if(--g.jt<=0){g.vy=-9;g.jt=90+Math.random()*120;}
    g.y+=g.vy;
    g.ph+=0.2;
    if(g.y>H)g.alive=false;
    if(hero.x+hero.w>g.x&&hero.x<g.x+g.w){
      const stomping=hero.vy>0&&hero.y+hero.h>g.y-14&&hero.y+hero.h<g.y+24;
      if(stomping){
        g.alive=false;hero.vy=-9;score+=g.bear?100:50;sfx.stomp();
        document.getElementById('score').textContent=score;
      }else if(hero.y+hero.h>g.y+4&&hero.y<g.y+g.hh){
        return kill();
      }
    }
  }
  // финиш: плато вершины
  if(hero.onGround&&Math.abs(cx-peakX)<120&&hero.y+hero.h<=peakY+24)startCelebration();
}

function drawOffice(){
  const x=28,w=136,h=76,top=groundY-h;
  // фасад
  ctx.fillStyle='#e8e4dc';ctx.fillRect(x,top,w,h);
  // карниз и крыша
  ctx.fillStyle='#cfc9bd';ctx.fillRect(x,top,w,6);
  ctx.fillStyle='#9aa5b1';ctx.fillRect(x-4,top-8,w+8,8);
  // окна
  ctx.fillStyle='#7ec8f0';
  ctx.fillRect(x+10,top+26,22,20);
  ctx.fillRect(x+w-32,top+26,22,20);
  ctx.strokeStyle='#b9b2a4';ctx.lineWidth=2;
  ctx.strokeRect(x+10,top+26,22,20);
  ctx.strokeRect(x+w-32,top+26,22,20);
  // дверь ровно под точкой старта героя (центр 75)
  ctx.fillStyle='#8b5a2b';ctx.fillRect(63,top+h-30,24,30);
  ctx.fillStyle='#ffd54f';ctx.fillRect(63+17,top+h-16,3,3);
  // вывеска с логотипом на крыше
  const sw=60,sh=30,sx=x+w/2-sw/2,sy=top-8-sh-3;
  ctx.fillStyle='#ffffff';ctx.fillRect(sx,sy,sw,sh);
  ctx.strokeStyle='#d64541';ctx.lineWidth=3;ctx.strokeRect(sx+1.5,sy+1.5,sw-3,sh-3);
  if(LO_LOGO.complete&&LO_LOGO.naturalWidth)ctx.drawImage(LO_LOGO,sx+9,sy+5,sw-18,sh-10);
  // флажок на углу крыши
  const fx=x+w+2,fy=top-8,fl=Math.sin(performance.now()/300)*3;
  ctx.strokeStyle='#5d3a1e';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(fx,fy);ctx.lineTo(fx,fy-16);ctx.stroke();
  ctx.fillStyle='#ff9800';
  ctx.beginPath();ctx.moveTo(fx,fy-16);ctx.lineTo(fx+13,fy-11+fl);ctx.lineTo(fx,fy-6);ctx.closePath();ctx.fill();
}
function drawBgMountain(x,base,w,h,color){
  ctx.fillStyle=color;
  ctx.beginPath();ctx.moveTo(x,base);ctx.lineTo(x+w/2,base-h);ctx.lineTo(x+w,base);ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.85)';
  ctx.beginPath();ctx.moveTo(x+w/2-h*0.28,base-h+h*0.28);ctx.lineTo(x+w/2,base-h);ctx.lineTo(x+w/2+h*0.28,base-h+h*0.28);ctx.closePath();ctx.fill();
}
function drawTent(x,baseY,w,h,c1,c2){
  ctx.fillStyle=c1;
  ctx.beginPath();ctx.moveTo(x-w/2,baseY);ctx.lineTo(x,baseY-h);ctx.lineTo(x+w/2,baseY);ctx.closePath();ctx.fill();
  ctx.fillStyle=c2;
  ctx.beginPath();ctx.moveTo(x-w/6,baseY);ctx.lineTo(x,baseY-h*0.55);ctx.lineTo(x+w/6,baseY);ctx.closePath();ctx.fill();
}
function drawTourist(x,y,t,c,wave){
  ctx.save();ctx.translate(x,y+Math.sin(t*2+x)*1.5);
  ctx.strokeStyle='#4a3728';ctx.lineWidth=3;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(-4,10);ctx.lineTo(-6,18);ctx.stroke();
  ctx.beginPath();ctx.moveTo(4,10);ctx.lineTo(6,18);ctx.stroke();
  ctx.fillStyle=c;ctx.fillRect(-6,-6,12,17);
  ctx.fillStyle='#ffd9a0';ctx.beginPath();ctx.arc(0,-11,6,0,7);ctx.fill();
  ctx.strokeStyle=c;
  ctx.beginPath();ctx.moveTo(-5,-3);ctx.lineTo(-10,2);ctx.stroke();
  if(wave){
    const a=Math.sin(t*5)*0.9-1.1;
    ctx.beginPath();ctx.moveTo(5,-3);ctx.lineTo(5+Math.cos(a)*11,-3+Math.sin(a)*11);ctx.stroke();
  }else{
    ctx.beginPath();ctx.moveTo(5,-3);ctx.lineTo(10,2);ctx.stroke();
  }
  ctx.restore();
}
function drawCampfire(x,y,t){
  ctx.strokeStyle='#5d4037';ctx.lineWidth=4;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(x-12,y);ctx.lineTo(x+12,y-6);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x-12,y-6);ctx.lineTo(x+12,y);ctx.stroke();
  const fl=6+Math.sin(t*9)*3;
  ctx.fillStyle='#ff7043';
  ctx.beginPath();ctx.moveTo(x-7,y-5);ctx.quadraticCurveTo(x,y-5-fl*2,x+7,y-5);ctx.closePath();ctx.fill();
  ctx.fillStyle='#ffd54f';
  ctx.beginPath();ctx.moveTo(x-4,y-5);ctx.quadraticCurveTo(x,y-5-fl,x+4,y-5);ctx.closePath();ctx.fill();
}
function drawGoat(g){
  ctx.save();ctx.translate(g.x+g.w/2,g.y);if(g.dir<0)ctx.scale(-1,1);
  const s=Math.sin(g.ph)*3;
  ctx.strokeStyle='#5d4a36';ctx.lineWidth=3;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(-8,18);ctx.lineTo(-10+s,26);ctx.stroke();
  ctx.beginPath();ctx.moveTo(8,18);ctx.lineTo(10-s,26);ctx.stroke();
  ctx.fillStyle='#e8e2d5';ctx.beginPath();ctx.ellipse(0,10,16,10,0,0,7);ctx.fill();
  ctx.fillStyle='#c9bfae';ctx.beginPath();ctx.ellipse(11,2,7,6,0.4,0,7);ctx.fill();
  ctx.strokeStyle='#8a7a5a';ctx.lineWidth=2.5;
  ctx.beginPath();ctx.moveTo(12,-3);ctx.lineTo(15,-11);ctx.stroke();
  ctx.beginPath();ctx.moveTo(9,-4);ctx.lineTo(9,-12);ctx.stroke();
  ctx.fillStyle='#222';ctx.beginPath();ctx.arc(13,0,1.6,0,7);ctx.fill();
  ctx.fillStyle='#f5f0e6';ctx.beginPath();ctx.ellipse(15,5,2,4,0.5,0,7);ctx.fill();
  ctx.restore();
}
function drawBear(g){
  ctx.save();ctx.translate(g.x+g.w/2,g.y);if(g.dir<0)ctx.scale(-1,1);
  const s=Math.sin(g.ph)*3;
  ctx.strokeStyle='#4a3320';ctx.lineWidth=4;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(-10,26);ctx.lineTo(-13+s,33);ctx.stroke();
  ctx.beginPath();ctx.moveTo(10,26);ctx.lineTo(13-s,33);ctx.stroke();
  ctx.fillStyle='#6b4423';ctx.beginPath();ctx.ellipse(0,16,23,15,0,0,7);ctx.fill();
  ctx.fillStyle='#5d3a1e';ctx.beginPath();ctx.arc(16,4,10,0,7);ctx.fill();
  ctx.fillStyle='#8b5a2b';ctx.beginPath();ctx.arc(11,-4,4.5,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(21,-4,4.5,0,7);ctx.fill();
  ctx.fillStyle='#d9a066';ctx.beginPath();ctx.ellipse(22,8,5,4,0,0,7);ctx.fill();
  ctx.fillStyle='#222';ctx.beginPath();ctx.arc(19,2,1.8,0,7);ctx.fill();
  ctx.restore();
}
function drawSandwich(s){
  if(s.got)return;
  const bob=Math.sin(s.ph)*3;
  ctx.save();ctx.translate(s.x,s.y+bob);
  ctx.fillStyle='#e8b96b';ctx.beginPath();ctx.roundRect(-14,-8,28,7,3);ctx.fill();
  ctx.fillStyle='#7cb342';ctx.fillRect(-13,-3,26,3);
  ctx.fillStyle='#a0522d';ctx.fillRect(-12,0,24,4);
  ctx.fillStyle='#e8b96b';ctx.beginPath();ctx.roundRect(-14,4,28,6,3);ctx.fill();
  ctx.restore();
}
function drawHero(x,y,dir,phase,armsUp){
  ctx.save();ctx.translate(x+hero.w/2,y);if(dir<0)ctx.scale(-1,1);
  const bob=hero.onGround?Math.sin(phase)*1.5:0;
  ctx.strokeStyle='#4a3728';ctx.lineWidth=4;ctx.lineCap='round';
  const s=hero.onGround?Math.sin(phase)*6:5;
  ctx.beginPath();ctx.moveTo(-5,34);ctx.lineTo(-7+s,44);ctx.stroke();
  ctx.beginPath();ctx.moveTo(5,34);ctx.lineTo(7-s,44);ctx.stroke();
  ctx.fillStyle='#d2691e';ctx.beginPath();ctx.roundRect(-16,10+bob,12,20,4);ctx.fill();
  ctx.fillStyle='#3aa655';ctx.beginPath();ctx.roundRect(-10,10+bob,20,26,6);ctx.fill();
  if(armsUp){
    ctx.strokeStyle='#3aa655';ctx.lineWidth=5;
    ctx.beginPath();ctx.moveTo(-8,14+bob);ctx.lineTo(-15,-2+bob);ctx.stroke();
    ctx.beginPath();ctx.moveTo(8,14+bob);ctx.lineTo(15,-2+bob);ctx.stroke();
  }
  ctx.fillStyle='#ffd9a0';ctx.beginPath();ctx.arc(0,2+bob,9,0,7);ctx.fill();
  ctx.fillStyle='#c0392b';
  ctx.beginPath();ctx.ellipse(0,-6+bob,13,4,0,0,7);ctx.fill();
  ctx.beginPath();ctx.ellipse(0,-10+bob,7,5,0,0,7);ctx.fill();
  ctx.fillStyle='#222';ctx.beginPath();ctx.arc(4,1+bob,1.6,0,7);ctx.fill();
  ctx.restore();
}

function draw(now){
  const t=now/300;
  // небо
  const sk=ctx.createLinearGradient(0,0,0,H);
  sk.addColorStop(0,'#7ec8f0');sk.addColorStop(1,'#cfeeff');
  ctx.fillStyle=sk;ctx.fillRect(0,0,W,H);
  // солнце
  ctx.fillStyle='rgba(255,236,150,.9)';
  ctx.beginPath();ctx.arc(W-80,90,36,0,7);ctx.fill();
  // параллакс гор
  const off=camX*0.3;
  for(let i=-1;i<W/300+2;i++)drawBgMountain(i*300-(off%300),groundY+camY,300,180+((i+Math.floor(off/300))%3)*40,'#7a9bb5');
  const off2=camX*0.6;
  for(let i=-1;i<W/240+2;i++)drawBgMountain(i*240-(off2%240),groundY+camY,240,120+((i+Math.floor(off2/240))%2)*30,'#5d7d99');

  ctx.save();ctx.translate(-camX,camY);
  // земля
  ctx.fillStyle='#6ab04c';
  ctx.fillRect(camX-60,groundY,W+120,H-groundY+320);
  ctx.fillStyle='#588f3d';
  for(let x=Math.floor((camX-60)/40)*40;x<camX+W+60;x+=40)ctx.fillRect(x,groundY,2,60);
  for(const p of pits){
    ctx.fillStyle='#3e2f23';ctx.fillRect(p.x1,groundY,p.x2-p.x1,320);
    ctx.fillStyle='#2a2018';ctx.fillRect(p.x1,groundY+40,p.x2-p.x1,280);
  }
  // офис LO на старте
  drawOffice();
  // платформы
  for(const p of plats){
    ctx.fillStyle='#8b5a2b';ctx.fillRect(p.x,p.y,p.w,p.h);
    ctx.fillStyle='#a0703d';ctx.fillRect(p.x,p.y,p.w,4);
  }
  // сувениры
  for(const c of coins){
    if(c.got)continue;
    ctx.save();ctx.translate(c.x,c.y);ctx.scale(Math.abs(Math.cos(t)),1);
    ctx.fillStyle='#ffcc00';ctx.beginPath();ctx.arc(0,0,10,0,7);ctx.fill();
    ctx.fillStyle='#e6a800';ctx.beginPath();ctx.arc(0,0,6,0,7);ctx.fill();
    ctx.restore();
  }
  sandwiches.forEach(s=>{s.ph+=0.05;drawSandwich(s);});
  // звери
  for(const g of enemies){if(!g.alive)continue;if(g.bear)drawBear(g);else drawGoat(g);}
  // ГОРА-ФИНИШ: рисуется по реальному профилю, зелёный склон
  ctx.fillStyle='#6f9a52';
  ctx.beginPath();ctx.moveTo(mX,groundY);
  for(let x=mX;x<=mX+mW;x+=12)ctx.lineTo(x,mGroundY(x));
  ctx.lineTo(mX+mW,groundY);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#5d8544';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(mX,groundY);
  for(let x=mX;x<=mX+mW;x+=12)ctx.lineTo(x,mGroundY(x));
  ctx.stroke();
  // тропа вдоль склона
  ctx.strokeStyle='#8a6f47';ctx.lineWidth=5;ctx.setLineDash([12,10]);
  ctx.beginPath();ctx.moveTo(mX+20,groundY);
  for(let x=mX+20;x<=mX+mW-20;x+=12)ctx.lineTo(x,mGroundY(x)-3);
  ctx.stroke();ctx.setLineDash([]);
  // снежная шапка: плато и верх склона, рваный край
  const snowY=peakY+mH*0.38;
  let xl=null,xr=null;
  for(let x=mX;x<=mX+mW;x+=4){if(mGroundY(x)<=snowY){xl=x;break;}}
  for(let x=mX+mW;x>=mX;x-=4){if(mGroundY(x)<=snowY){xr=x;break;}}
  if(xl!==null&&xr!==null&&xr>xl){
    ctx.fillStyle='#ffffff';
    ctx.beginPath();ctx.moveTo(xl,mGroundY(xl));
    for(let x=xl;x<=xr;x+=8)ctx.lineTo(x,mGroundY(x));
    ctx.lineTo(xr,snowY+6);
    const seg=(xr-xl)/6;
    for(let k=0;k<6;k++){ctx.lineTo(xr-seg*(k+0.5),snowY+(k%2?14:4));ctx.lineTo(xr-seg*(k+1),snowY+6);}
    ctx.closePath();ctx.fill();
  }
  // ЛАГЕРЬ на вершине
  const py1=peakY+16;
  drawTent(peakX-45,py1+4,150,112,'#e67e22','#f9d29a');
  ctx.strokeStyle='#5d3a1e';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(peakX-45,py1+4-112);ctx.lineTo(peakX-45,py1-118);ctx.stroke();
  ctx.fillStyle='#e74c3c';
  ctx.beginPath();ctx.moveTo(peakX-45,py1-118);ctx.lineTo(peakX-20,py1-111);ctx.lineTo(peakX-45,py1-104);ctx.closePath();ctx.fill();
  drawTent(peakX+80,mGroundY(peakX+80)+2,56,42,'#16a085','#a8e6cf');
  drawTent(peakX-135,mGroundY(peakX-135)+2,52,40,'#c0392b','#f1948a');
  drawCampfire(peakX+25,py1+6,t);
  const tw=celebrating?3:1;
  drawTourist(peakX-95,py1+4,t*tw,'#2980b9',true);
  drawTourist(peakX-15,py1+4,t*tw,'#8e44ad',celebrating);
  drawTourist(peakX+55,py1+4,t*tw,'#27ae60',true);
  drawTourist(peakX+105,py1+8,t*tw,'#d35400',celebrating);
  drawTourist(peakX-115,py1+2,t*tw,'#c0392b',celebrating);
  // герой
  drawHero(hero.x,hero.y,hero.dir,hero.run,celebrating);
  // конфетти
  for(const q of parts){
    ctx.globalAlpha=Math.min(1,q.life/40);
    ctx.fillStyle=q.c;ctx.fillRect(q.x,q.y,6,9);
    ctx.globalAlpha=1;
  }
  ctx.restore();

  if(celebrating){
    const by=peakY+camY-40-Math.min(14,celebT/6);
    ctx.fillStyle='rgba(255,255,255,.9)';
    ctx.font='bold 34px sans-serif';ctx.textAlign='center';
    ctx.strokeStyle='#2c5f8a';ctx.lineWidth=4;
    ctx.strokeText('🏕️ Привал!',W/2,Math.max(70,by));
    ctx.fillText('🏕️ Привал!',W/2,Math.max(70,by));
    ctx.textAlign='left';
  }
}

let last=performance.now();
function loop(now){
  const dt=Math.min((now-last)/16.7,3);last=now;
  if(playing)physics();
  if(celebrating){
    celebT++;
    for(const q of parts){q.x+=q.vx;q.y+=q.vy;q.vy+=0.05;q.life--;}
    parts=parts.filter(q=>q.life>0);
  }
  // камера
  if(celebrating){
    camX+=(Math.max(0,Math.min(peakX-W/2,totalW-W))-camX)*0.1;
    camY+=(Math.max(0,Math.min(300,H*0.42-peakY))-camY)*0.06;
  }else{
    camX=Math.max(0,Math.min(hero.x-W/2,totalW-W));
    const lift=(hero.onGround&&hero.y+hero.h<groundY-140)?Math.min(50,groundY-(hero.y+hero.h)-100):0;
    camY+=(lift-camY)*0.08;
  }
  draw(now);
  requestAnimationFrame(loop);
}
loadLevel(0);
requestAnimationFrame(loop);
</script>
<script type="module">
// ===== LO.ink SDK: интеграция с хостом LO =====
// При запуске внутри LO адаптер находится автоматически; вне LO игра работает автономно.
function applyLOTheme(t){
  try{
    const ov=document.querySelectorAll('.overlay');
    if(t.background)ov.forEach(o=>o.style.background=t.background);
    if(t.text)ov.forEach(o=>o.style.color=t.text);
    if(t.action)document.querySelectorAll('.overlay button').forEach(b=>b.style.background=t.action);
    if(t.secondaryBackground)document.querySelectorAll('.overlay button').forEach(b=>b.style.color=t.text||'#5a3d00');
  }catch(e){}
}
(async()=>{
  try{
    const [ad,sdk]=await Promise.all([
      import('https://esm.sh/@lo-ink/adapter-lo'),
      import('https://esm.sh/@lo-ink/miniapp-sdk')
    ]);
    const adapter=(ad&&ad.createAdapter)?ad.createAdapter():null;
    if(!adapter)return; // нет хоста — автономный режим
    const client=sdk.createMiniAppClient(adapter);
    window.LO={adapter:adapter,client:client};
    const snap=adapter.snapshot?adapter.snapshot():null;
    if(snap&&snap.theme)applyLOTheme(snap.theme);
    const chip=document.getElementById('verChip');
    if(chip)chip.textContent='v1.0.26 · LO';
  }catch(e){/* автономный режим без SDK */}
})();
</script>
<div id="verChip" style="position:fixed;right:10px;bottom:8px;color:#fff;opacity:.8;font:600 13px sans-serif;text-shadow:0 1px 3px rgba(0,0,0,.55);z-index:9">v1.0.26</div>
</body>
